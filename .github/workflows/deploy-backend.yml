name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".npmrc"
      - ".nvmrc"
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".npmrc"
      - ".nvmrc"
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/abalmush/dyllu-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dyllu_mcp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dyllu_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Validate 1C plugin
        run: |
          pnpm --filter @dyllu/medusa-plugin-one-c typecheck
          pnpm --filter @dyllu/medusa-plugin-one-c lint
          pnpm --filter @dyllu/medusa-plugin-one-c test
          pnpm --filter @dyllu/medusa-plugin-one-c build

      - name: Validate MCP plugin
        env:
          MCP_MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dyllu_mcp_test
        run: |
          pnpm --filter @dyllu/medusa-plugin-mcp typecheck
          pnpm --filter @dyllu/medusa-plugin-mcp lint
          pnpm --filter @dyllu/medusa-plugin-mcp test
          pnpm --filter @dyllu/medusa-plugin-mcp test:postgres
          pnpm --filter @dyllu/medusa-plugin-mcp build

      - name: Typecheck backend
        run: pnpm --filter @dyllu/backend typecheck

      - name: Run backend unit tests
        run: pnpm --filter @dyllu/backend test:unit

      - name: Compile backend and admin
        run: pnpm --filter @dyllu/backend build

  build-and-deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        run: |
          curl --fail --silent --show-error "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

      - name: Smoke-test public backend
        run: |
          sleep 30
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 60 --retry-delay 10 --retry-all-errors \
            https://api.dyllu.md/ready >/dev/null
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 12 --retry-delay 10 --retry-all-errors \
            https://api.dyllu.md/backend >/dev/null

      - name: Extract Telegram notification from the merged PR
        if: success()
        id: telegram_note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].body // ""')
          note=$(printf '%s' "$body" \
            | sed -n '/<TelegramNotification>/,/<\/TelegramNotification>/p' \
            | sed '1s/.*<TelegramNotification>//' \
            | sed '$s/<\/TelegramNotification>.*//' \
            | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -n "$(printf '%s' "$note" | tr -d '[:space:]')" ]; then
            delimiter="telegram_note_$(openssl rand -hex 8)"
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "text<<$delimiter"
              printf '%s\n' "$note"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram notification
        if: success() && steps.telegram_note.outputs.found == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: ${{ steps.telegram_note.outputs.text }}
